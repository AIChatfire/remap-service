# LLM 模型映射网关 —— 本地与单机部署编排
#
#   cp .env.example .env && docker compose up -d
#
# 全部配置来自 .env —— compose 会自动加载同目录的 .env 并注入容器。
# 遥测只有 Logfire 一条出口：.env 里给 LOGFIRE_TOKEN 即自动开启，
# trace 与 metrics 都直接外发，本机不再暴露指标端口、不再需要本地存储卷。

name: remap

# 日志不限量会在长跑的机器上把磁盘吃满，各服务共用同一份轮转策略。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  gateway:
    container_name: remap
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
    image: remap-gateway:${VERSION:-dev}
    restart: unless-stopped
    ports:
      # 默认只绑本机。公网暴露前请确认已有反代或安全组兜底 ——
      # 网关自身没有准入鉴权，任何能连上的客户端都能通过它转发。
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-8080}:8080"       # 网关入口
    env_file:
      - .env
    healthcheck:
      # distroless 无 shell/curl，用网关自身的 -check 做静态校验；
      # 存活性交给编排层的 TCP 探针或 /healthz HTTP 探针。
      test: ["CMD", "/gateway", "-check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    stop_grace_period: 30s   # 留足时间摘流量 + 放完在途的长请求（LLM 单请求可达数十秒）
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    read_only: true          # 镜像里只有一个静态二进制，运行期无需写盘
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - remap

networks:
  remap:
    driver: bridge
