name: Release

on:
#  push:
#    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（手动触发时使用，如 v0.1.0）"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # 发布不中断，避免推到一半留下残缺 tag

permissions:
  contents: write   # 创建 Release
  packages: write   # 推送 GHCR

env:
  GOTOOLCHAIN: local
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # 发布前重跑一遍闸门。tag 触发时 CI 不跑，这里必须自带验证，
  # 否则可能发出一个测试就没过的版本。
  verify:
    name: 发布前验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt / vet / test
        run: |
          out=$(gofmt -l ./cmd ./internal)
          [[ -z "$out" ]] || { echo "未格式化: $out" >&2; exit 1; }
          go vet ./...
          go test -race -count=1 -timeout 10m ./...

  # ---------- 多平台二进制 ----------
  binaries:
    name: 交叉编译二进制
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # make build 用 git describe 取版本

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 解析版本号
        id: v
        run: echo "version=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: 构建
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            out="dist/gateway-${os}-${arch}"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags "$LDFLAGS" -o "$out" ./cmd/gateway
            echo "built $out"
          done
          # 校验和随包发布，便于下载方核对完整性。
          (cd dist && sha256sum gateway-* > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/
          retention-days: 7

  # ---------- 多架构镜像 ----------
  image:
    name: 推送 GHCR 镜像
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # arm64 用 QEMU 模拟构建；纯 Go + CGO_ENABLED=0，慢但可靠。
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.event.inputs.version || github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- GitHub Release ----------
  release:
    name: 创建 Release
    needs: [binaries, image]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## 镜像

            ```bash
            docker pull ${{ env.IMAGE }}:${{ github.ref_name }}
            ```

            二进制见下方附件，`SHA256SUMS` 可用于校验完整性。
