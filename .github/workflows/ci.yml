name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]     # tag 走 release.yml，避免重复跑
  pull_request:
  workflow_dispatch:

# 同一分支的新 push 取消尚未跑完的旧任务，省 runner 额度。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 关掉遥测上报，CI 里没必要且会拖慢首次构建。
  GOTOOLCHAIN: local

jobs:
  # ---------- 静态检查 ----------
  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod   # 单一事实来源，升级 go.mod 即自动跟随
          cache: true

      # gofmt 不会返回非零退出码，必须显式检查输出。
      - name: gofmt
        run: |
          out=$(gofmt -l ./cmd ./internal)
          if [[ -n "$out" ]]; then
            echo "以下文件未格式化，请本地执行 make fmt：" >&2
            echo "$out" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # go.mod / go.sum 与源码不一致时，依赖会在别处莫名失败，提前拦掉。
      - name: go mod tidy 无残留
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum \
            || { echo "go.mod/go.sum 需要 tidy，请本地执行 make tidy 后提交" >&2; exit 1; }

      # 必须钉版本，不能用 latest：staticcheck 会抬高自身 go.mod 的最低 Go
      # 版本（v0.8.0 起要求 go >= 1.26.0），配合 GOTOOLCHAIN=local 就会让无关
      # 的 PR 莫名挂在 go install 上。v0.7.0 (2026.1) 要求 go 1.25.0，与本项目
      # go.mod 对齐。升级 go.mod 到 1.26 后可同步升到 v0.8.x。
      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: v0.7.0
          install-go: false   # 复用上面 setup-go 的版本，避免装第二份工具链

      # 工作流自身也要校验：语法或表达式写错时，没有这一步就只能靠
      # 推上去才发现。actionlint 同时会跑 shellcheck 检查 run 里的脚本。
      # 同样钉版本，理由见上面 staticcheck：@latest 会随上游抬高最低 Go 版本
      # 而在 GOTOOLCHAIN=local 下突然失败。v1.7.12 要求 go 1.25.0。
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml

  # ---------- 单元测试 ----------
  test:
    name: 测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # -race 是这个项目的重点：网关同时跑 goroutine 池、SSE 流式转发和
      # 共享的脱敏规则表，竞态一旦漏出去就是线上偶发脏数据。
      - name: go test -race
        run: go test -race -count=1 -timeout 10m ./...

      - name: 覆盖率
        if: matrix.os == 'ubuntu-latest'
        run: |
          go test -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tail -1

      - name: 上传覆盖率报告
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  # ---------- 端到端 ----------
  e2e:
    name: 端到端（mock 上游）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 脚本用 lsof 做端口占用预检，runner 镜像不一定装。
      - name: 安装 lsof
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends lsof

      - name: make build
        run: make build

      # 只跑不需要密钥的那套；e2e-ark 需要真实 ARK_KEY，留给手动触发。
      # 显式指定端口：脚本有端口占用预检，runner 上若有服务撞了默认 18080
      # 会直接 exit 2，指定冷门端口消除这个不确定性。
      - name: make e2e
        env:
          GW_PORT: "18981"
          UP_PORT: "19981"
        run: make e2e

      # 失败时脚本的断言输出往往不够定位，日志才是关键。
      - name: 失败时输出服务日志
        if: failure()
        run: |
          echo "=== 网关 ==="; cat /tmp/e2e_gw.log 2>/dev/null || true
          echo "=== mock 上游 ==="; cat /tmp/e2e_up.log 2>/dev/null || true

  # ---------- 镜像与编排 ----------
  docker:
    name: 镜像构建与编排校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 只构建不推送：PR 阶段验证 Dockerfile 可用，推送交给 release.yml。
      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: remap-gateway:ci
          build-args: |
            VERSION=ci-${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 二进制真的能起来、配置校验能通过，比"镜像构建成功"更有信息量。
      - name: 冒烟 -version / -check
        run: |
          docker run --rm remap-gateway:ci -version
          docker run --rm -e UPSTREAM_BASE=https://example.com/v1 remap-gateway:ci -check

      # compose 文件写错会在部署时才暴露，CI 里静态展开一次即可拦住。
      - name: 校验 compose 语法
        run: |
          cp .env.example .env
          docker compose config -q
