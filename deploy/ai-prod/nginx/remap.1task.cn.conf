# remap-service :80 入口 —— 除 ACME 验证外一律跳 HTTPS
server {
    listen 80;
    server_name remap.1task.cn;

    access_log /www/wwwlogs/remap.1task.cn.log;
    error_log  /www/wwwlogs/remap.1task.cn.error.log;

    # ACME HTTP-01：必须 ^~ 且排在 location / 之前，否则被 catch-all 吃掉导致签发/续期失败
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/acme;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
