# remap-service HTTPS 入口（由 apply-https.sh 投放，勿手工编辑服务器上副本）
# 证书：acme.sh（Let's Encrypt），HTTP-01（DNS 已指向本机），自动续期并 reload nginx。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name remap.1task.cn;

    ssl_certificate     /www/server/panel/vhost/cert/remap.1task.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/remap.1task.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /www/wwwlogs/remap.1task.cn.log;
    error_log  /www/wwwlogs/remap.1task.cn.error.log;

    location / {
        include /www/server/panel/vhost/nginx/remap-proxy.inc;
    }
}
