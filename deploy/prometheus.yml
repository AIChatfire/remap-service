# 抓取网关自身暴露的指标。
#
# 前提：网关侧 .env 需设 OBS_ENABLED=true 且 METRICS_ADDR=:9090，
# 否则 /metrics 端点不会监听，这里会一直是 target down。

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: remap-gateway

scrape_configs:
  - job_name: remap-gateway
    # 走 compose 内部网络的服务名，不依赖宿主机端口映射。
    # Prometheus 配置文件不做环境变量展开，这里的值必须写死。
    static_configs:
      - targets: ["gateway:9090"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
